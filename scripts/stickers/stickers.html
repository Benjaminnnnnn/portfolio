<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Original sticker set for the portfolio. Rendered to PNG by render.mjs. -->
<style>
@font-face { font-family: "tiktok"; src: url("../../public/fonts/TikTokSans.ttf"); font-weight: 100 900; }
@font-face { font-family: "mono"; src: url("../../public/fonts/GeistMono[wght].ttf"); font-weight: 100 900; }
@font-face { font-family: "pixel"; src: url("../../public/fonts/DepartureMono-Regular.otf"); }
html, body { margin: 0; background: transparent; }
body { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
.s { width: 480px; height: 480px; display: grid; place-items: center; }
svg { overflow: visible; }
text { font-family: "tiktok", sans-serif; }
.mono { font-family: "mono", monospace; }
.pixel { font-family: "pixel", monospace; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Die-cut white border + soft lift shadow + paper grain, applied to each sticker group. -->
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="14" result="thick" />
      <feGaussianBlur in="thick" stdDeviation="1.2" result="thickSoft" />
      <feFlood flood-color="#fffdf7" />
      <feComposite in2="thickSoft" operator="in" result="border" />
      <feGaussianBlur in="thick" stdDeviation="7" result="blur" />
      <feOffset in="blur" dy="6" result="drop" />
      <feFlood flood-color="#1b1f2a" flood-opacity="0.22" />
      <feComposite in2="drop" operator="in" result="shadow" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="grain" />
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.14 0" result="grainTint" />
      <feMerge result="art"><feMergeNode in="shadow" /><feMergeNode in="border" /><feMergeNode in="SourceGraphic" /></feMerge>
      <feComposite in="grainTint" in2="thick" operator="in" result="grainMask" />
      <feMerge><feMergeNode in="art" /><feMergeNode in="grainMask" /></feMerge>
    </filter>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3ff" /><stop offset=".3" stop-color="#f7d9ff" /><stop offset=".55" stop-color="#fffbd6" /><stop offset=".8" stop-color="#d6ffe9" /><stop offset="1" stop-color="#dbe4ff" />
    </linearGradient>
    <linearGradient id="pinkfoil" gradientUnits="userSpaceOnUse" x1="90" y1="70" x2="310" y2="270"><stop offset="0" stop-color="#ff9ad1" /><stop offset=".45" stop-color="#ff3d8b" /><stop offset=".7" stop-color="#b86bff" /><stop offset="1" stop-color="#6b7cff" /></linearGradient>
    <radialGradient id="rubyGlow" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff7a9a" /><stop offset=".5" stop-color="#e0245e" /><stop offset="1" stop-color="#7d0b2e" /></radialGradient>
  </defs>
</svg>

<!-- 12 BZ smiley -->
<div class="s" id="bz"><svg width="400" height="400" viewBox="0 0 400 400"><g filter="url(#cut)">
  <circle cx="200" cy="200" r="160" fill="#4a7dff" stroke="#111a3a" stroke-width="10" />
  <text x="152" y="200" text-anchor="middle" font-size="96" font-weight="900" fill="#fff">B</text>
  <text x="252" y="200" text-anchor="middle" font-size="96" font-weight="900" fill="#fff">Z</text>
  <path d="M124 246c40 50 112 50 152 0" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" />
  <circle cx="110" cy="256" r="16" fill="#ff9ad1" opacity=".8" /><circle cx="290" cy="256" r="16" fill="#ff9ad1" opacity=".8" />
</g></svg></div>

<script>
// A* tile cells
const cells = document.getElementById("cells");
// Path cells: (0,0)(1,0)(2,0)(2,1)(2,2)(3,2)(4,2)(4,3)(4,4)(5,4)(5,5) — no wall sits on them.
const walls = new Set(["3,0", "5,1", "0,3", "3,3", "1,5", "6,2", "1,1", "6,6", "4,6", "3,1", "5,3"]);
for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("x", 86 + x * 38); r.setAttribute("y", 86 + y * 38); r.setAttribute("width", 30); r.setAttribute("height", 30); r.setAttribute("rx", 5);
  r.setAttribute("fill", walls.has(`${x},${y}`) ? "#7c5cff" : "#1d1d22");
  cells.appendChild(r);
}
// 200 OK starburst
const pts = [];
for (let i = 0; i < 32; i++) { const a = (i / 32) * Math.PI * 2; const rr = i % 2 ? 150 : 172; pts.push(`${200 + Math.cos(a) * rr},${200 + Math.sin(a) * rr}`); }
document.getElementById("burst").setAttribute("d", `M${pts.join("L")}Z`);
// Pixel heart
const heart = ["..XX...XX..", ".XXXX.XXXX.", "XXXXXXXXXXX", "XXXXXXXXXXX", "XXXXXXXXXXX", ".XXXXXXXXX.", "..XXXXXXX..", "...XXXXX...", "....XXX....", ".....X....."];
const hg = document.getElementById("heart");
heart.forEach((row, y) => [...row].forEach((c, x) => {
  if (c !== "X") return;
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("x", 90 + x * 20); r.setAttribute("y", 70 + y * 20); r.setAttribute("width", 20.5); r.setAttribute("height", 20.5);
  if ((x === 2 || x === 3) && y === 1) r.setAttribute("fill", "#fff");
  hg.appendChild(r);
}));
window.__ready = true;
</script>
</body>
</html>
