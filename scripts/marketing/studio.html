<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marketing studio</title>
<!--
  Marketing compositions for every portfolio project. Rendered by render.mjs
  (studio.html?slug=<slug>) at 1600×1000 CSS px, 1.5× device scale.
  Every screen inside a frame is a real capture from public/project-media, or
  real text (recorded events, source excerpts, API schema). Only backgrounds,
  frames and labels are composed here.
-->
<style>
@font-face { font-family: "tiktok"; src: url("../../public/fonts/TikTokSans.ttf"); font-weight: 100 900; }
@font-face { font-family: "mono"; src: url("../../public/fonts/GeistMono[wght].ttf"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1600px; height: 1000px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1600px; height: 1000px; overflow: hidden; font-family: "tiktok", system-ui, sans-serif; color: var(--ink); background: var(--bg); isolation: isolate; }

/* Background: mesh gradient orbs, fine grid and grain */
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .9; z-index: -3; }
.grid { position: absolute; inset: 0; z-index: -2; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, #000 30%, transparent 85%); }
.grain { position: absolute; inset: -50%; z-index: -1; opacity: .16; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* Wordmark + tagline */
.brand { position: absolute; left: 80px; top: 72px; z-index: 5; }
.brand .kicker { font: 500 15px/1 "mono", monospace; letter-spacing: .22em; text-transform: uppercase; opacity: .7; }
.brand h1 { margin-top: 18px; font-weight: 650; font-size: 76px; line-height: .98; letter-spacing: -.045em; max-width: 620px; }
.brand h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Frames */
.scene { position: absolute; inset: 0; perspective: 2400px; }
.win { position: absolute; border-radius: 18px; overflow: hidden; background: var(--win, #0e0d14); box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 50px 120px -30px rgba(0,0,0,.65), 0 20px 50px -20px var(--glow, rgba(0,0,0,.5)); }
.win.light { --win: #f7f7f8; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 50px 120px -35px rgba(20,20,40,.45), 0 20px 50px -20px var(--glow, rgba(0,0,0,.3)); }
.bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.08); }
.light .bar { background: #ececef; border-color: rgba(0,0,0,.06); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.dot:nth-child(2) { background: #febc2e; } .dot:nth-child(3) { background: #28c840; }
.url { margin-left: 18px; flex: 1; max-width: 420px; height: 22px; border-radius: 6px; background: rgba(255,255,255,.08); font: 12px/22px "mono", monospace; color: rgba(255,255,255,.55); padding: 0 10px; white-space: nowrap; overflow: hidden; }
.light .url { background: #fff; color: #6b6b75; }
.win img { display: block; width: 100%; }
.phone { position: absolute; border-radius: 34px; overflow: hidden; box-shadow: 0 60px 120px -40px rgba(60,30,20,.55), 0 0 0 1px rgba(0,0,0,.05); }
.phone img { display: block; width: 100%; }

/* Code + terminal */
.code { padding: 26px 30px; font: 400 17px/1.7 "mono", monospace; color: #dfe6e1; white-space: pre; }
.ln { display: inline-block; width: 34px; color: rgba(255,255,255,.25); }
.k { color: #d6b3ff; } .t { color: #9fd3ff; } .c { color: #7f8f86; font-style: italic; } .s { color: #ffd494; } .f { color: #8ff0c0; } .n { color: #ffb38a; }
.hl { display: inline-block; width: calc(100% + 60px); margin: 0 -30px; padding: 0 30px; background: rgba(143,240,192,.08); box-shadow: inset 3px 0 0 #8ff0c0; }

/* Chips */
.chip { position: absolute; z-index: 6; display: inline-flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; font: 500 18px/1.2 "tiktok", sans-serif; color: var(--chip-ink, #fff); background: var(--chip, rgba(20,18,30,.72)); backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 24px 50px -20px rgba(0,0,0,.6); }
.chip b { font-weight: 700; }
.chip .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--pip, #4ade80); box-shadow: 0 0 14px var(--pip, #4ade80); }
.chip small { display: block; font: 500 12px/1.3 "mono", monospace; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin-bottom: 4px; }
.caption { position: absolute; right: 36px; bottom: 26px; z-index: 6; font: 500 11px/1 "mono", monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const M = "../../public/project-media/";
const C = "./captures/";
const win = (o) => `<div class="win ${o.light ? "light" : ""}" style="${o.style}">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>${o.url ? `<span class="url">${o.url}</span>` : ""}</div>
  ${o.html ?? `<img src="${o.src}" style="${o.imgStyle ?? ""}">`}
</div>`;
const chip = (style, html, vars = "") => `<div class="chip" style="${style};${vars}">${html}</div>`;
const orbs = (list) => list.map(([x, y, r, c]) => `<div class="orb" style="left:${x}px;top:${y}px;width:${r}px;height:${r}px;background:${c}"></div>`).join("");

const S = {

    theme: { bg: "#0b0d10", ink: "#f3efe9", line: "rgba(255,255,255,.05)", grad: "linear-gradient(90deg,#ff7a45,#ffc46b)" },
    orbs: [[900, -200, 700, "#d54d2c"], [1200, 500, 600, "#6b2a17"], [-200, 600, 500, "#1d3a4a"]],
    kicker: "Relay · distributed jobs", title: "A worker crashed. <em>The job still finished.</em>",
    body: () => `
      ${win({ url: "relay — recorded experiment", style: "left:720px;top:200px;width:820px;transform:rotateY(-10deg) rotateX(4deg);--glow:rgba(213,77,44,.55)", html: `<div class="code" style="font-size:18px">${[
        ["0.000 s", "enqueued", "—", "#9aa5ad"], ["0.016 s", "claimed", "crash-victim", "#9fd3ff"], ["0.943 s", "lease_expired", "crash-victim", "#ff7a45"],
        ["0.998 s", "claimed", "replacement", "#9fd3ff"], ["3.003 s", "succeeded", "replacement", "#8ff0c0"]].map(([t, e, w, c]) =>
        `<span class="c" style="font-style:normal">${t}</span>   <span style="color:${c};display:inline-block;width:190px">${e}</span><span style="color:#cfd6da">${w}</span>`).join("\n")}\n\n<span class="c">// one job · attempt 2 · local run, Sept 2026</span></div>` })}
      ${win({ url: "throughput — jobs / s", style: "left:580px;top:600px;width:600px;transform:rotateY(-10deg) rotateX(4deg);--glow:rgba(255,196,107,.35)", html: `<div style="padding:26px 30px;display:grid;gap:16px;font:500 16px 'mono',monospace;color:#dfe6e1">${[["1 slot", 62.2], ["4 slots", 255.4], ["12 slots · 3 proc", 862.0]].map(([l, v]) =>
        `<div style="display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:14px"><span style="opacity:.7">${l}</span><span style="height:12px;border-radius:6px;background:linear-gradient(90deg,#d54d2c,#ffc46b);width:${v / 8.62}%"></span><span>${Math.round(v)}</span></div>`).join("")}</div>` })}

  handpick: {

      ${chip("left:80px;top:660px", `<span class="pip"></span><div><small>trust</small><b>Nothing leaves until you confirm</b></div>`, "--chip:rgba(255,255,255,.78);--chip-ink:#231d1a;--pip:#7c6cff")}`,

  splendor: {

    body: () => `

        ${win({ url: "algo-explorer.vercel.app/explore", src: C + "algo-explore.webp", style: "left:460px;top:610px;width:540px;z-index:3;transform:rotateY(-12deg) rotateX(5deg);--glow:rgba(34,211,238,.4)" })}
      </div>
      ${chip("left:80px;top:440px", `<span class="pip"></span><div><small>A* · frame 23 / 23</small><b>Target found. Path rebuilt.</b></div>`, "--pip:#34d399")}`,

    orbs: [[820, -240, 720, "#1f5a3a"], [1260, 520, 520, "#3a5a1f"], [-180, 560, 480, "#16303a"]],
    kicker: "SimpleDB · database internals", title: "From a query <em>down to the page.</em>",
    body: () => `
      <div class="scene">
        ${win({ url: "simpledb/BufferPool.java", style: "left:680px;top:190px;width:860px;transform:rotateY(-10deg) rotateX(4deg);--win:#101814;--glow:rgba(143,240,192,.35)", html: `<div class="code">${[
          `<span class="k">public</span> <span class="t">Page</span> <span class="f">getPage</span>(<span class="t">TransactionId</span> tid, <span class="t">PageId</span> pid,`,
          `                    <span class="t">Permissions</span> perm) {`,
          `    <span class="hl">lockerManager.<span class="f">acquireLock</span>(tid, pid, perm);</span>`,
          `    <span class="k">if</span> (<span class="k">this</span>.cachedPages.<span class="f">containsKey</span>(pid)) {`,
          `        <span class="k">return</span> cachedPages.<span class="f">get</span>(pid);`,
          `    }`,
          `    <span class="k">int</span> tableid = pid.<span class="f">getTableId</span>();`,
          `    <span class="t">Page</span> newCachedPage = <span class="t">Database</span>.<span class="f">getCatalog</span>()`,
          `        .<span class="f">getDatabaseFile</span>(tableid).<span class="f">readPage</span>(pid);`,
          `    <span class="hl"><span class="k">while</span> (<span class="k">this</span>.cachedPages.<span class="f">size</span>() >= numPages) {</span>`,
          `        <span class="f">evictPage</span>();`,
          `    }`,
          `    <span class="k">this</span>.cachedPages.<span class="f">put</span>(pid, newCachedPage);`,
          `    <span class="k">return</span> newCachedPage;`,
          `}`].map((l, i) => `<span class="ln">${75 + i + (i > 1 ? 2 : 0)}</span>${l}`).join("\n")}</div>` })}
      </div>
      ${chip("left:80px;top:470px", `<span class="pip"></span><div><small>concurrency</small><b>Page-level locks per transaction</b></div>`, "--pip:#8ff0c0")}
      ${chip("left:80px;top:570px", `<span class="pip"></span><div><small>buffer pool</small><b>Evict before a new page loads</b></div>`, "--pip:#d6f5a6")}`,
    caption: "Source excerpt · BufferPool.java",
  },
  "petclinic-devops": {
    theme: { bg: "#070c18", ink: "#eef3ff", line: "rgba(120,160,255,.06)", grad: "linear-gradient(90deg,#7aa2ff,#7ef0c8)" },
    orbs: [[760, -260, 760, "#1e3a8a"], [1250, 500, 560, "#0f5b4b"], [-200, 560, 520, "#3b1e6b"]],
    kicker: "PetClinic · build & deploy", title: "Build, scan, <em>then watch it run.</em>",
    body: () => `
      <div class="scene">
        ${win({ url: "grafana · jenkins health", src: C + "petclinic-grafana.webp", style: "left:700px;top:150px;width:860px;transform:rotateY(-12deg) rotateX(5deg);--glow:rgba(122,162,255,.45)" })}
        ${win({ url: "sonarqube · spring-petclinic", light: true, src: C + "petclinic-sonar.webp", style: "left:470px;top:630px;width:600px;z-index:3;transform:rotateY(-12deg) rotateX(5deg)" })}
      </div>
      ${chip("left:80px;top:440px", `<span class="pip"></span><div><small>pipeline</small><b>Jenkins → SonarQube → ZAP → VM</b></div>`, "--pip:#7ef0c8")}`,
    caption: "Historical project screenshots · browser chrome cropped",
  },
  "333gle": {
    theme: { bg: "#f3ead8", ink: "#2b2721", line: "rgba(80,60,30,.06)", grad: "linear-gradient(90deg,#b8481e,#e07b39)" },
    orbs: [[820, -220, 700, "#f0c49c"], [1250, 520, 520, "#c7d6f0"], [-160, 560, 480, "#f3d9a8"]],
    kicker: "333gle · search systems", title: "A search engine, <em>written in C++.</em>",
    body: () => `
      <div class="scene">
        ${win({ url: "localhost:5555/query?terms=hello", light: true, src: M + "333gle.webp", style: "left:700px;top:150px;width:860px;transform:rotateY(-12deg) rotateX(5deg)" })}
        ${win({ url: "HttpServer.cc", style: "left:470px;top:600px;width:640px;z-index:3;transform:rotateY(-12deg) rotateX(5deg);--win:#1d1b18", html: `<div class="code" style="font-size:15px"><span class="c">// Spin, accepting connections and dispatching them.</span>
<span class="t">ThreadPool</span> tp(kNumThreads);   <span class="c">// kNumThreads = 100</span>
<span class="k">while</span> (<span class="n">1</span>) {
  <span class="t">HttpServerTask</span> *hst = <span class="k">new</span> <span class="t">HttpServerTask</span>(HttpServer_ThrFn);
  hst->indices = &amp;indices_;
  <span class="k">if</span> (!socket_.<span class="f">Accept</span>(&amp;hst->client_fd, …)) <span class="k">break</span>;
  <span class="hl">tp.<span class="f">Dispatch</span>(hst);</span>
}</div>` })}
      </div>
      ${chip("left:80px;top:440px", `<span class="pip"></span><div><small>server</small><b>Thread pool + on-disk index</b></div>`, "--chip:rgba(255,255,255,.8);--chip-ink:#2b2721;--pip:#e07b39")}`,
    caption: "Existing search capture · UW CSE 333",
  },
  xv6: {
    theme: { bg: "#050a06", ink: "#dfebd5", line: "rgba(170,201,133,.06)", grad: "linear-gradient(90deg,#aac985,#e6ffb0)" },
    orbs: [[820, -240, 700, "#1f4a24"], [1260, 520, 520, "#2f4a12"], [-200, 560, 500, "#0f2a2a"]],
    kicker: "xv6 · operating systems", title: "Inside a <em>teaching kernel.</em>",
    body: () => `
      <div class="scene">
        ${win({ url: "xv6 shell", src: M + "xv6.webp", style: "left:600px;top:170px;width:960px;transform:rotateY(-12deg) rotateX(5deg);--win:#111;--glow:rgba(170,201,133,.4)" })}

    body: () => `

  },
  cliphop: {
    theme: { bg: "#07060d", ink: "#fdf6ff", line: "rgba(255,64,129,.05)", grad: "linear-gradient(90deg,#ff4081,#ffb74d,#00e5ff)" },
    orbs: [[760, -260, 760, "#9d174d"], [1250, 520, 560, "#0e7490"], [-200, 560, 520, "#4c1d95"]],
    kicker: "ClipHop · social video", title: "Short clips. <em>Loud colors.</em>",
